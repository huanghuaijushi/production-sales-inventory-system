server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: production-sales-inventory-api
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/production_sales_inventory?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:psi_user}
    password: ${DB_PASSWORD:psi_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
      repositories:
        enabled: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:production-sales-inventory-api}
      secret: ${JWT_SECRET:change-this-dev-secret-for-production-sales-inventory-api-please}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT2H}
    cors:
      allowed-origins:
        - ${WEB_ORIGIN:http://localhost:5173}
      allowed-origin-patterns:
        - http://localhost:*
        - http://127.0.0.1:*
        - http://192.168.*:*
        - http://10.*:*
        - http://172.16.*:*
        - http://172.17.*:*
        - http://172.18.*:*
        - http://172.19.*:*
        - http://172.20.*:*
        - http://172.21.*:*
        - http://172.22.*:*
        - http://172.23.*:*
        - http://172.24.*:*
        - http://172.25.*:*
        - http://172.26.*:*
        - http://172.27.*:*
        - http://172.28.*:*
        - http://172.29.*:*
        - http://172.30.*:*
        - http://172.31.*:*
        - http://198.18.*:*
      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Trace-Id
      allow-credentials: true
